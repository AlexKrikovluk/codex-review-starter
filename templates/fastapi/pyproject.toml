[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-project"
version = "0.1.0"
description = "FastAPI project with automated reviews"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "mypy>=1.15", "ruff>=0.9"]

[tool.pytest.ini_options]
addopts = "-q --cov=. --cov-report=term-missing --cov-fail-under=80"
testpaths = ["."]

[tool.setuptools]
py-modules = ["main", "models", "schemas"]
