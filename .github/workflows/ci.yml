name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # weekly Monday 9am UTC

jobs:
  lint-and-type:
    name: Lint, format, type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy==1.15.0 ruff==0.9.1 pytest pytest-cov
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov
      - name: Run tests with coverage
        run: pytest -q --cov=. --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          if git grep -n -E "(API_KEY|SECRET|TOKEN|PASSWORD|password|token|api_key)\s*=\s*['\"][^'\"]+['\"]" -- '*.py' '*.sh' '*.md' '*.toml' '*.yml' '*.yaml'; then
            echo "::error::Potential hardcoded secret found"
            exit 1
          fi
          echo "No hardcoded secrets detected"

  workflow:
    name: Workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate shell scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "All shell scripts valid"
