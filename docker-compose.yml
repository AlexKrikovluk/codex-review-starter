version: '3.8'

services:
  codex-review:
    image: python:3.14-slim
    working_dir: /app
    volumes:
      - ./:/app
      - ~/.config/systemd/user:/etc/systemd/user:ro
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: >
      bash -c "
        pip install pytest pytest-cov mypy ruff &&
        bash scripts/install.sh &&
        tail -f /dev/null
      "
    restart: unless-stopped

  alert-dispatcher:
    image: python:3.14-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ALERT_EMAIL=${ALERT_EMAIL}
    command: python scripts/alerts/__init__.py
    restart: unless-stopped
    depends_on:
      - codex-review

  research-pipeline:
    image: python:3.14-slim
    working_dir: /app
    volumes:
      - ./:/app
      - research:/app/research
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: bash scripts/research_pipeline.sh
    restart: unless-stopped
    depends_on:
      - codex-review

volumes:
  research:
